# GPU override — use this on Linux machines with a GPU
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# NVIDIA: Requires nvidia-container-toolkit installed on the host
# AMD/Intel: Uncomment devices /dev/dri and group_add video

services:
  leam:
    # AMD/Intel users should uncomment these:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, utility]
