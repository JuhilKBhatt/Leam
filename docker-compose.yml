services:
  leam:
    build: .
    ports:
      - "5000:5000"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./:/app
      # Prevent host's local environments from overwriting the container's linux environments
      - /app/venv
      - /app/remotion/node_modules
    env_file:
      - .env
    restart: always
    shm_size: '2gb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G